apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  labels: { app: orders-api }
spec:
  # The API applies migrations on startup, so start with one replica. After that it can be scaled:
  # the outbox uses FOR UPDATE SKIP LOCKED, so replicas never publish the same row at the same time.
  replicas: 1
  selector:
    matchLabels: { app: orders-api }
  template:
    metadata:
      labels: { app: orders-api }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: orders-api:local
          imagePullPolicy: IfNotPresent # images are loaded into kind with `kind load docker-image`
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: orders-config }
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
spec:
  selector: { app: orders-api }
  ports:
    - port: 80
      targetPort: 8080
