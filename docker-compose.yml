# Local development stack. Placeholder credentials only - do not reuse them anywhere real.
#   docker compose up -d db rabbitmq   -> just the infrastructure (run the apps with dotnet run)
#   docker compose up --build          -> everything, API on http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI (guest / guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/Orders.Api/Dockerfile
    environment:
      ConnectionStrings__Orders: Host=db;Port=5432;Database=orders;Username=orders;Password=orders
      ConnectionStrings__RabbitMq: amqp://guest:guest@rabbitmq:5672
    ports:
      - "8080:8080"
    depends_on:
      db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  worker:
    build:
      context: .
      dockerfile: src/Orders.Worker/Dockerfile
    environment:
      ConnectionStrings__Orders: Host=db;Port=5432;Database=orders;Username=orders;Password=orders
      ConnectionStrings__RabbitMq: amqp://guest:guest@rabbitmq:5672
    depends_on:
      db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      api: { condition: service_started } # the API applies the database migrations
